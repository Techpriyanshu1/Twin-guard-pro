name: Build and Release TwinGuard CCTV APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for Gradle
        run: chmod +x gradlew || true

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TwinGuard-CCTV-APK
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/app-debug.apk
          name: TwinGuard CCTV Release ${{ github.ref_name }}
          body: |
            ## TwinGuard CCTV – Smart Offline Security Camera v2.0
            
            ### Included in this release:
            - **Camera Mode**: Standalone offline CCTV security camera with CameraX, live streaming, digital zoom, torch, autofocus, and 480p/720p/1080p profiles.
            - **Monitor Mode**: Real-time live viewer with PTZ remote controls, two-way audio walkie-talkie, and diagnostics HUD.
            - **Laptop Viewer**: Embedded local HTTP server streaming live to Chrome/Edge at `http://<phone-ip>:8080`.
            - **Offline Motion Detection**: On-device differential motion detection with multi-zone support and auto-snapshots.
            - **Local Recording Vault**: Timestamped MP4 recordings saved in device storage.
            
            ### Installation:
            1. Download `app-debug.apk`.
            2. Open the file on your Android device and tap **Install**.
          draft: false
          prerelease: false
